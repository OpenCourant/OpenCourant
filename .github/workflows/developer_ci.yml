name: Developer CI

on:

  pull_request:
    # Skip PRs targeting the sandbox branch and any sandbox/* branch, plus workflow-only changes
    branches-ignore:
      - sandbox
      - 'sdb/**'
    paths-ignore:
      - '.github/workflows/**'

env:
  QA_TIMEOUT_PER_TEST: 150
  # The commit of the PR to embed it in the build tag
  RADIOSS_SHA_HEADER: ${{ github.event.pull_request.head.sha }}

# CI runs on GitHub-hosted runners inside the OpenCourant build image
# (ghcr.io/opencourant/linux64-bld-qa, built from
# https://github.com/OpenCourant/ci-images). This replaces the
# Altair-internal registry and self-hosted runners inherited from
# OpenRadioss, which are not accessible to OpenCourant.

jobs:

  # Flags PRs that modify workflow files. Informational only: all jobs run
  # on GitHub-hosted runners, where workflow changes from PRs pose no risk
  # to shared infrastructure. Make this blocking again (exit 1) if
  # self-hosted runners are ever added.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Detect workflow changes
        run: |
          # fetch base branch
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1

          # list changed files in the PR
          changed=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }})
          echo "Files changed in this PR:"
          echo "$changed"
          echo "-----"

          if echo "$changed" | grep -E '^\.github/workflows/'; then
            echo "::warning::This PR modifies workflow files — review them with extra care."
          fi

  # Copyright-header gate: every header in the tree must match one of the
  # canonical variants, and every file changed by the PR must carry the
  # OpenCourant modification notice with a current year.
  # On failure: python3 scripts/copyright/check_headers.py --fix <files>
  check_headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: the checker validates headers against the
          # openradioss-final tag and diffs against the base branch.
          fetch-depth: 0

      - name: Check all headers
        run: python3 scripts/copyright/check_headers.py --all

      - name: Check changed files carry the modification notice
        run: >
          python3 scripts/copyright/check_headers.py
          --changed "origin/${{ github.event.pull_request.base.ref }}"

  build-for-qa:
    needs: guard
    if: ${{ github.repository_owner == 'OpenCourant' }}

    runs-on: ubuntu-latest

    env:
      BUILD_NB_THREAD: 4

    strategy:
      # If one job fails others are canceled
      fail-fast: true
      matrix:
        include:
          - build: starter_linux64_gf
            precision: dp
            os: linux64
            binary: starter

          - build: engine_linux64_gf_ompi
            precision: dp
            os: linux64
            binary: engine
            mpi: ompi

    container:
      image: "ghcr.io/opencourant/linux64-bld-qa:ompi4.1.2"
      volumes:
        - /etc/localtime:/etc/localtime:ro

    steps:

      # Get last git modifications, WS is not persistent here
      - uses: actions/checkout@v6
        with:
          lfs: 'false'
          ref: refs/pull/${{ github.event.number }}/merge

      - name: Running build
        run: |
          echo "Running using ref: refs/pull/${{ github.event.number }}/merge"

          mpi_opts=''
          if [ ! -z ${{ matrix.mpi }} ]
          then
            mpi_opts="-mpi=${{ matrix.mpi }}"
          fi

          cmd="./build_script.sh -release -arch=${{ matrix.os }}_gf -prec=${{ matrix.precision }} -nt=${{ env.BUILD_NB_THREAD }} -static-link $mpi_opts"
          echo "========================================="
          echo "--  BUILD ${{ matrix.build }} --"
          echo "--  $cmd --"
          echo "========================================="
          source /root/.bashrc
          chmod 755 Compiling_tools/script/*
          chmod 755 ${{ matrix.binary }}/build_script.sh

          mkdir exec
          cd ${{ matrix.binary }}

          eval $cmd

          cd ..
          md5sum exec/* || exit 1

      # Upload artifact (since V4 we can't upload artifact using the same name, each one must be unique)
      - name: Upload built artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bins-${{ matrix.os }}-${{ matrix.precision }}-${{ matrix.build }}
          path: exec

      # We upload extlib only once, arbitrary choice
      - name: Upload extlib artifacts
        uses: actions/upload-artifact@v7
        with:
          name: extlib.zip
          path: extlib.zip
        if: ${{ matrix.build == 'starter_linux64_gf' }}

  build:
    needs: guard
    if: ${{ github.repository_owner == 'OpenCourant' }}

    runs-on: ubuntu-latest

    env:
      BUILD_NB_THREAD: 4

    strategy:
      # If one job fails others are canceled
      fail-fast: true
      matrix:
        include:

          - build: starter_linux64_gf_sp
            precision: sp
            os: linux64
            binary: starter

          - build: engine_linux64_gf_ompi_sp
            precision: sp
            os: linux64
            binary: engine
            mpi: ompi

    container:
      image: "ghcr.io/opencourant/linux64-bld-qa:ompi4.1.2"
      volumes:
        - /etc/localtime:/etc/localtime:ro

    steps:

      # Get last git modifications, WS is not persistent here
      - uses: actions/checkout@v6
        with:
          lfs: 'false'
          ref: refs/pull/${{ github.event.number }}/merge

      - name: Running build
        run: |
          echo "Running using ref: refs/pull/${{ github.event.number }}/merge"

          mpi_opts=''
          if [ ! -z ${{ matrix.mpi }} ]
          then
            mpi_opts="-mpi=${{ matrix.mpi }}"
          fi

          cmd="./build_script.sh -release -arch=${{ matrix.os }}_gf -prec=${{ matrix.precision }} -nt=${{ env.BUILD_NB_THREAD }} -static-link $mpi_opts"
          echo "========================================="
          echo "--  BUILD ${{ matrix.build }} --"
          echo "--  $cmd --"
          echo "========================================="
          source /root/.bashrc
          chmod 755 Compiling_tools/script/*
          chmod 755 ${{ matrix.binary }}/build_script.sh

          mkdir exec
          cd ${{ matrix.binary }}

          eval $cmd

          cd ..
          md5sum exec/* || exit 1

      # Upload artifact (since V4 we can't upload artifact using the same name, each one must be unique)
      - name: Upload built artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bins-${{ matrix.os }}-${{ matrix.precision }}-${{ matrix.build }}
          path: exec

  # TODO: re-enable once the gcc-plugin based analysis is validated in the
  # OpenCourant build image. The inherited job depended on the Altair-internal
  # rd-linux64-or-rl8.10-bld-qa image and self-hosted runners.
  # code-analysis:
  #   ...

  qa:
    needs: build-for-qa
    runs-on: ubuntu-latest
    container:
      image: "ghcr.io/opencourant/linux64-bld-qa:ompi4.1.2"
      volumes:
        - /etc/localtime:/etc/localtime:ro

    env:
      hm_reader_extlib: ../../extlib/hm_reader
      hm_reader_cfgfiles: ../../hm_cfg_files
      homeuser: /root
      mpi: ompi
      QA_NB_PROC: 2
      QA_NB_THREAD: 2

    strategy:
      # If one job fails others are canceled
      fail-fast: false
      matrix:
        os: [linux64]
        # precision: [dp,sp]
        precision: [dp]

    steps:

      # Get git related to the commit
      - uses: actions/checkout@v6
        with:
          lfs: 'false'
          ref: refs/pull/${{ github.event.number }}/merge

      - name: Clean local exe dir
        run: |
          rm -rf exec

      # Download artifacts (since V4 we must download all needed artifacts, we could do it using wildcard but it doesn't work ... see https://github.com/actions/download-artifact/issues/337)
      # Using hard name waiting for this issue to be fixed
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: bins-${{ matrix.os }}-${{ matrix.precision }}-starter_linux64_gf
          path: exec
          merge-multiple: true
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: bins-${{ matrix.os }}-${{ matrix.precision }}-engine_linux64_gf_ompi
          path: exec
          merge-multiple: true
      - name: Download extlib artifact
        uses: actions/download-artifact@v8
        with:
          name: extlib.zip

      - name: Unzip extlib
        run: |
          unzip extlib.zip

      - name: Running qa
        run: |
          md5sum exec/* || echo "Nothing in exec/"
          if [ "${{ matrix.precision }}" = "dp" ]
          then
            precision_ext=""
          else
            precision_ext="_${{ matrix.precision }}"
          fi

          chmod 755 exec/*
          cd qa-tests/scripts
          chmod 755 or_qa_script or_radioss.pl
          rm -f QA.summary

          # Allow root to execute mpi command (we are in docker container as root)
          export OMPI_ALLOW_RUN_AS_ROOT=1
          export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1

          source ${{ env.homeuser }}/.bashrc
          export LD_LIBRARY_PATH=${{ env.hm_reader_extlib }}/${{ matrix.os }}:$LD_LIBRARY_PATH

          cmd="./or_qa_script ../../exec/engine_${{ matrix.os }}_gf_${{ env.mpi }}${precision_ext} 1.0 --env:RAD_CFG_PATH=${{ env.hm_reader_cfgfiles }} --system_run --env:OMP_STACKSIZE=400m --exec_script_args='mpiexec -np ${{ env.QA_NB_PROC }}' --env:OMP_NUM_THREADS=${{ env.QA_NB_THREAD }} --output_failures_stdout --xtra_args='--timeoutscript=${{ env.QA_TIMEOUT_PER_TEST }}' "
          echo "========================================="
          echo "--  QA ${{ matrix.os }}_${{ matrix.precision }} --"
          echo "--  $cmd --"
          echo "========================================="
          eval $cmd
          res=$?

          # Getting failed test
          nbtestsfailed=$(grep "# Runs Failed\s*:" QA.summary | tail -n 1 | awk -F' ' '{print $5}')
          # Checking if no test has run at all (maybe exec errors)
          nbtestsok=$(grep "# Runs Successful\s*:" QA.summary | tail -n 1 | awk -F' ' '{print $5}')

          if [ $res -gt 0 ] || [ $nbtestsfailed -gt 0 ] || [ $nbtestsok = 0 ]
          then
            # If at least one test is failed we mark the CI as failed
            echo "All tests are not OK, CI is failed"
            exit 1
          fi
