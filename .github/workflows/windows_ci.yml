name: Windows CI

# Experimental Windows build pipeline on GitHub-hosted runners.
# Restores the win64 builds that upstream ran on self-hosted runners with a
# preinstalled Intel toolchain. The toolchain versions match upstream
# (compiler 2025.0, MKL 2025.0); Intel oneAPI 2025.0.1 is installed from
# Intel's offline installers and cached.
#
# Scope: SMP variants only. The engine_win64_impi* variants (Intel MPI
# 2021.10) are deferred.
#
# Once stable this moves into PR Merge CI MAIN (matching upstream, which
# ran Windows builds post-merge only, never on PRs).

on:
  workflow_dispatch:

env:
  WINDOWS_HPCKIT_URL: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/a37c30c3-a846-4371-a85d-603e9a9eb94c/intel-oneapi-hpc-toolkit-2025.0.1.48_offline.exe
  WINDOWS_BASEKIT_URL: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/ae29263e-38b9-4d43-86c3-376d6e0668e7/intel-oneapi-base-toolkit-2025.0.1.47_offline.exe
  HPCKIT_COMPONENTS: intel.oneapi.win.ifort-compiler:intel.oneapi.win.cpp-dpcpp-common
  BASEKIT_COMPONENTS: intel.oneapi.win.mkl.devel
  ONEAPI_CACHE_KEY: oneapi-win-1-compiler2025.0.1-mkl2025.0.1
  BUILD_NB_THREAD: 4

jobs:

  build_windows:
    if: ${{ github.repository_owner == 'OpenCourant' }}
    # windows-2022 (VS2022 / MSVC 14.4x): the VS2026 STL on windows-latest
    # requires Clang 20+, while icx 2025.0 is Clang 19-based (error STL1000).
    # Revisit when the toolchain moves to a newer oneAPI.
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        include:
          - build: starter_win64
            precision: dp
            binary: starter

          - build: engine_win64
            precision: dp
            binary: engine

    steps:

      - name: Checkout git sources
        uses: actions/checkout@v6
        with:
          lfs: 'false'

      - name: Restore Intel oneAPI cache
        id: oneapi-cache
        uses: actions/cache@v4
        with:
          path: 'C:\Program Files (x86)\Intel\oneAPI'
          key: ${{ env.ONEAPI_CACHE_KEY }}

      - name: Install Intel oneAPI (ifx, icx, MKL)
        if: steps.oneapi-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          echo === Installing HPC Kit components: %HPCKIT_COMPONENTS%
          curl.exe -s --output %TEMP%\hpckit.exe --url %WINDOWS_HPCKIT_URL% --retry 5 --retry-delay 5
          start /b /wait %TEMP%\hpckit.exe -s -x -f hpckit_extracted --log hpckit_extract.log
          hpckit_extracted\bootstrapper.exe -s --action install --components=%HPCKIT_COMPONENTS% --eula=accept -p=NEED_VS2017_INTEGRATION=0 -p=NEED_VS2019_INTEGRATION=0 -p=NEED_VS2022_INTEGRATION=0 --log-dir=.
          if errorlevel 1 exit /b 1
          rd /s/q hpckit_extracted
          del %TEMP%\hpckit.exe

          echo === Installing Base Kit components: %BASEKIT_COMPONENTS%
          curl.exe -s --output %TEMP%\basekit.exe --url %WINDOWS_BASEKIT_URL% --retry 5 --retry-delay 5
          start /b /wait %TEMP%\basekit.exe -s -x -f basekit_extracted --log basekit_extract.log
          basekit_extracted\bootstrapper.exe -s --action install --components=%BASEKIT_COMPONENTS% --eula=accept -p=NEED_VS2017_INTEGRATION=0 -p=NEED_VS2019_INTEGRATION=0 -p=NEED_VS2022_INTEGRATION=0 --log-dir=.
          if errorlevel 1 exit /b 1
          rd /s/q basekit_extracted
          del %TEMP%\basekit.exe

      - name: Running build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          call "C:\Program Files (x86)\Intel\oneAPI\compiler\2025.0\env\vars.bat"
          call "C:\Program Files (x86)\Intel\oneAPI\mkl\2025.0\env\vars.bat"
          where ifx && ifx --version
          where icx
          cmake --version
          ninja --version
          echo =========================================
          echo --  BUILD ${{ matrix.build }} --
          echo =========================================
          cd ${{ matrix.binary }}
          call build_windows.bat -release -arch=win64 -prec=${{ matrix.precision }} -nt=%BUILD_NB_THREAD%
          cd ..
          if not exist exec ( echo No exec directory & exit /b 1 )
          dir exec
          for /f %%A in ('dir /b /a-d exec ^| find /c /v ""') do if %%A==0 ( echo exec is empty & exit /b 1 )

      - name: Upload built artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bins-win64-${{ matrix.precision }}-${{ matrix.build }}
          path: exec

  qa_windows:
    needs: build_windows
    runs-on: windows-2022

    env:
      QA_TIMEOUT_PER_TEST_WIN: 500
      QA_NB_THREAD: 2

    steps:

      - name: Checkout git sources
        uses: actions/checkout@v6
        with:
          lfs: 'false'

      - name: Restore Intel oneAPI cache
        id: oneapi-cache
        uses: actions/cache/restore@v4
        with:
          path: 'C:\Program Files (x86)\Intel\oneAPI'
          key: ${{ env.ONEAPI_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Download starter artifacts
        uses: actions/download-artifact@v8
        with:
          name: bins-win64-dp-starter_win64
          path: exec
          merge-multiple: true
      - name: Download engine artifacts
        uses: actions/download-artifact@v8
        with:
          name: bins-win64-dp-engine_win64
          path: exec
          merge-multiple: true

      - name: Download extlib
        shell: cmd
        run: |
          python Compiling_tools\script\load_extlib.py
          if errorlevel 1 exit /b 1

      - name: Running qa
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\compiler\2025.0\env\vars.bat"
          call "C:\Program Files (x86)\Intel\oneAPI\mkl\2025.0\env\vars.bat"
          set PATH=%GITHUB_WORKSPACE%\extlib\hm_reader\win64;%GITHUB_WORKSPACE%\extlib\h3d\lib\win64;%PATH%
          set RAD_CFG_PATH=%GITHUB_WORKSPACE%\hm_cfg_files
          set KMP_STACKSIZE=400m
          set OMP_NUM_THREADS=%QA_NB_THREAD%
          dir exec
          cd qa-tests\scripts
          if exist QA.summary del QA.summary
          perl or_qa_script ..\..\exec\engine_win64.exe 1.0 --env:RAD_CFG_PATH=%RAD_CFG_PATH% --system_run --env:KMP_STACKSIZE=400m --env:OMP_NUM_THREADS=%QA_NB_THREAD% --output_failures_stdout --xtra_args="--timeoutscript=%QA_TIMEOUT_PER_TEST_WIN%"
          set QA_RES=%ERRORLEVEL%
          findstr /C:"# Runs" QA.summary
          for /f "tokens=5" %%A in ('findstr /C:"# Runs Failed" QA.summary') do set NBFAILED=%%A
          for /f "tokens=5" %%A in ('findstr /C:"# Runs Successful" QA.summary') do set NBOK=%%A
          if not "%QA_RES%"=="0" ( echo QA script failed & exit /b 1 )
          if not "%NBFAILED%"=="0" ( echo Tests failed & exit /b 1 )
          if "%NBOK%"=="0" ( echo No test ran & exit /b 1 )
