name: Windows CI

# Dispatchable Windows build + QA pipeline, used for iterating on the
# Windows toolchain without touching the post-merge CI. The same jobs run
# in PR Merge CI MAIN (matching upstream, which ran Windows builds
# post-merge only, never on PRs).
#
# Toolchain: Intel oneAPI 2025.0.1 (ifx/icx + MKL), matching the 2025.0
# toolchain upstream used, installed via .github/actions/setup-oneapi-win.
# Runner: windows-2022 — the VS2026 STL on windows-latest requires
# Clang 20+, while icx 2025.0 is Clang 19-based (error STL1000).
#
# Scope: SMP variants only. The engine_win64_impi* variants (Intel MPI
# 2021.10) are deferred.

on:
  workflow_dispatch:

env:
  BUILD_NB_THREAD: 4

jobs:

  build_windows:
    if: ${{ github.repository_owner == 'OpenCourant' }}
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        include:
          - build: starter_win64
            precision: dp
            binary: starter

          - build: starter_win64_sp
            precision: sp
            binary: starter

          - build: engine_win64
            precision: dp
            binary: engine

          - build: engine_win64_sp
            precision: sp
            binary: engine

          - build: engine_win64_impi
            precision: dp
            binary: engine
            mpi: impi

          - build: engine_win64_impi_sp
            precision: sp
            binary: engine
            mpi: impi

    steps:

      - name: Checkout git sources
        uses: actions/checkout@v6
        with:
          lfs: 'false'

      - name: Set up Intel oneAPI
        uses: ./.github/actions/setup-oneapi-win

      - name: Running build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          call "C:\Program Files (x86)\Intel\oneAPI\compiler\2025.0\env\vars.bat"
          call "C:\Program Files (x86)\Intel\oneAPI\mkl\2025.0\env\vars.bat"
          call "C:\Program Files (x86)\Intel\oneAPI\mpi\latest\env\vars.bat"
          set mpi_opts=
          if not "${{ matrix.mpi }}"=="" set mpi_opts=-mpi=${{ matrix.mpi }}
          echo =========================================
          echo --  BUILD ${{ matrix.build }} --
          echo =========================================
          cd ${{ matrix.binary }}
          call build_windows.bat -release -arch=win64 -prec=${{ matrix.precision }} -nt=%BUILD_NB_THREAD% %mpi_opts%
          cd ..
          if not exist exec ( echo No exec directory & exit /b 1 )
          dir exec
          for /f %%A in ('dir /b /a-d exec ^| find /c /v ""') do if %%A==0 ( echo exec is empty & exit /b 1 )

      - name: Upload built artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bins-win64-${{ matrix.precision }}-${{ matrix.build }}
          path: exec

  qa_windows:
    needs: build_windows
    runs-on: windows-2022

    env:
      QA_TIMEOUT_PER_TEST_WIN: 500
      QA_NB_PROC: 2
      QA_NB_THREAD: 2

    steps:

      - name: Checkout git sources
        uses: actions/checkout@v6
        with:
          lfs: 'false'

      - name: Set up Intel oneAPI
        uses: ./.github/actions/setup-oneapi-win

      - name: Download starter artifacts
        uses: actions/download-artifact@v8
        with:
          name: bins-win64-dp-starter_win64
          path: exec
          merge-multiple: true
      - name: Download engine artifacts
        uses: actions/download-artifact@v8
        with:
          name: bins-win64-dp-engine_win64_impi
          path: exec
          merge-multiple: true

      - name: Download extlib
        shell: cmd
        run: |
          python Compiling_tools\script\load_extlib.py
          if errorlevel 1 exit /b 1

      # The QA perl scripts need Cygwin (native Windows perl lacks getppid);
      # upstream ran them from Cygwin on its self-hosted runners too.
      - name: Install Cygwin with perl
        shell: cmd
        run: |
          curl.exe -s --output %TEMP%\cygsetup.exe --url https://www.cygwin.com/setup-x86_64.exe --retry 5 --retry-delay 5
          %TEMP%\cygsetup.exe -q -R C:\cygwin64 -s https://mirrors.kernel.org/sourceware/cygwin/ -P perl -l %TEMP%\cygpkgs
          C:\cygwin64\bin\bash --login -c "perl --version | head -2"

      - name: Register the Intel MPI hydra service
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\mpi\latest\env\vars.bat"
          hydra_service.exe -install

      # Running cygwin from cmd => neither indentation nor comment inside the
      # bash -c string (same constraint as the inherited OpenRadioss CI)
      - name: Running qa
        shell: cmd
        run: >
          call "C:\Program Files (x86)\Intel\oneAPI\compiler\2025.0\env\vars.bat" &&
          call "C:\Program Files (x86)\Intel\oneAPI\mkl\2025.0\env\vars.bat" &&
          call "C:\Program Files (x86)\Intel\oneAPI\mpi\latest\env\vars.bat" &&
          C:\cygwin64\bin\bash --login -c "
          cd %cd:\=/%;
          chmod -R 755 extlib/* exec/* 2>/dev/null;
          cd qa-tests/scripts;
          rm -f QA.summary;
          chmod 755 or_qa_script or_radioss.pl;
          export PATH=../../extlib/hm_reader/win64:../../extlib/h3d/lib/win64:$PATH;
          cmd=\"./or_qa_script ../../exec/engine_win64_impi.exe 1.0 --env:RAD_CFG_PATH=../../hm_cfg_files --system_run --env:KMP_STACKSIZE=400m --exec_script_args='mpiexec -np %QA_NB_PROC%' --env:OMP_NUM_THREADS=%QA_NB_THREAD% --output_failures_stdout --xtra_args='--timeoutscript=%QA_TIMEOUT_PER_TEST_WIN%' \";
          echo \"--  $cmd --\";
          eval $cmd;
          res=$?;
          nbtestsfailed=$(grep \"# Runs Failed\s*:\" QA.summary | tail -n 1 | awk -F' ' '{print $5}');
          nbtestsok=$(grep \"# Runs Successful\s*:\" QA.summary | tail -n 1 | awk -F' ' '{print $5}');
          if [ $res -gt 0 ] || [ $nbtestsfailed -gt 0 ] || [ $nbtestsok = 0 ];
          then
          echo \"All tests are not OK, CI is failed\";
          exit 1;
          fi;
          "

      # Dry run of the runtime bundling planned for the delivery pipeline:
      # enumerate the Intel MPI runtime, copy the curated subset out of the
      # oneAPI tree, and prove it runs a model with mpiexec -localonly using
      # only compiler/MKL vars (no MPI env).
      - name: MPI runtime harvest dry run
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\mpi\latest\env\vars.bat"
          echo === I_MPI_ROOT=%I_MPI_ROOT%
          dir "%I_MPI_ROOT%\bin"
          dir "%I_MPI_ROOT%\opt\mpi\libfabric\bin" 2>nul || dir "%I_MPI_ROOT%\libfabric\bin" 2>nul
          mkdir %TEMP%\mpirt
          for %%F in (impi.dll mpiexec.exe hydra_service.exe hydra_bstrap_proxy.exe hydra_pmi_proxy.exe) do copy "%I_MPI_ROOT%\bin\%%F" %TEMP%\mpirt\ || exit /b 1
          if exist "%I_MPI_ROOT%\opt\mpi\libfabric\bin" ( xcopy /y /e "%I_MPI_ROOT%\opt\mpi\libfabric\bin\*" %TEMP%\mpirt\ ) else ( xcopy /y /e "%I_MPI_ROOT%\libfabric\bin\*" %TEMP%\mpirt\ )
          dir %TEMP%\mpirt

      - name: MPI runtime subset run (no MPI env)
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\compiler\2025.0\env\vars.bat"
          call "C:\Program Files (x86)\Intel\oneAPI\mkl\2025.0\env\vars.bat"
          set PATH=%TEMP%\mpirt;%CD%\extlib\hm_reader\win64;%CD%\extlib\h3d\lib\win64;%PATH%
          set RAD_CFG_PATH=%CD%\hm_cfg_files
          set KMP_STACKSIZE=400m
          set OMP_NUM_THREADS=2
          cd qa-tests\miniqa\ACCELEROMETRES\data
          "%GITHUB_WORKSPACE%\exec\starter_win64.exe" -i ACCELERO_0000.rad -np 2 > s.out 2>&1
          if errorlevel 1 ( type s.out & exit /b 1 )
          %TEMP%\mpirt\mpiexec.exe -localonly -np 2 "%GITHUB_WORKSPACE%\exec\engine_win64_impi.exe" -i ACCELERO_0001.rad > e.out 2>&1
          if errorlevel 1 ( type e.out & exit /b 1 )
          findstr /C:"NORMAL TERMINATION" e.out
