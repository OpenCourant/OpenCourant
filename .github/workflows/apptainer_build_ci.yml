name: Apptainer build CI

# Dispatch-only check that Apptainer/opencourant_build.def (the from-source
# definition) still builds and runs. Not part of any release path; run it
# on demand, e.g. when the def or the build scripts change.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Git ref to build (default: latest stable release tag)'
        required: false
        default: 'latest-release'

jobs:

  build_def:
    if: ${{ github.repository_owner == 'OpenCourant' }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-latest
            arch: linux64_gf
            arch_dir: linux64

          - platform: arm64
            runner: ubuntu-24.04-arm
            arch: linuxa64_gf
            arch_dir: linuxa64

    steps:

      - name: Checkout git sources
        uses: actions/checkout@v6
        with:
          lfs: 'false'

      - name: Install Apptainer
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces by default
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get install -y apptainer
          apptainer --version

      - name: Build from definition
        run: |
          apptainer build opencourant_build.sif Apptainer/opencourant_build.def \
            --build-arg ARCH=${{ matrix.arch }} \
            --build-arg ARCH_DIR=${{ matrix.arch_dir }} \
            --build-arg SOURCE_REF=${{ github.event.inputs.source_ref }}
          ls -lh opencourant_build.sif

      - name: SIF qa
        run: |
          set -e
          cp -a qa-tests/miniqa/ACCELEROMETRES/data /tmp/sifmodel
          cd /tmp/sifmodel
          export OMP_NUM_THREADS=2
          apptainer exec ${GITHUB_WORKSPACE}/opencourant_build.sif \
            starter -i ACCELERO_0000.rad -np 1 > s.out 2>&1 || { cat s.out; exit 1; }
          apptainer exec ${GITHUB_WORKSPACE}/opencourant_build.sif \
            engine -i ACCELERO_0001.rad > e.out 2>&1 || { cat e.out; exit 1; }
          grep "NORMAL TERMINATION" e.out
