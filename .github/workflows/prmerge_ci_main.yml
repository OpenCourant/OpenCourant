name: PR Merge CI MAIN

# Post-merge CI for the main branch. Runs on GitHub-hosted runners inside
# the OpenCourant build image (ghcr.io/opencourant/linux64-bld-qa, built
# from https://github.com/OpenCourant/ci-images). This replaces the
# Altair-internal registry, self-hosted runners, mail relay, Perforce sync
# and branch-closing machinery inherited from OpenRadioss, none of which
# are accessible to OpenCourant. Failures surface as failed workflow runs.
#
# TODO(windows): the inherited Windows build/QA jobs are disabled for now.
# They required self-hosted Windows runners with the Intel oneAPI
# toolchain plus a private EXTRA repository for runtime libraries.
# Restore them once OpenCourant has Windows build infrastructure.

on:

  push:
    branches:
      - main

  workflow_dispatch:

env:
  QA_TIMEOUT_PER_TEST_LINUX: 150
  # The current commit to embed it in the build tag
  RADIOSS_SHA_HEADER: ${{ github.sha }}

jobs:

  build_linux:
    if: ${{ github.repository_owner == 'OpenCourant' }}
    runs-on: ubuntu-latest
    container:
      image: "ghcr.io/opencourant/linux64-bld-qa:ompi4.1.2"
      volumes:
        - /etc/localtime:/etc/localtime:ro

    env:
      BUILD_NB_THREAD: 4

    strategy:
      # If one job fails others are canceled
      fail-fast: true
      matrix:
        include:
          - build: starter_linux64_gf
            precision: dp
            os: linux64
            binary: starter

          - build: starter_linux64_gf_sp
            precision: sp
            os: linux64
            binary: starter

          - build: engine_linux64_gf_ompi
            precision: dp
            os: linux64
            binary: engine
            mpi: ompi

          - build: engine_linux64_gf_ompi_sp
            precision: sp
            os: linux64
            binary: engine
            mpi: ompi

          - build: engine_linux64_gf
            precision: dp
            os: linux64
            binary: engine

          - build: engine_linux64_gf_sp
            precision: sp
            os: linux64
            binary: engine

    steps:

      - name: Checkout git sources
        uses: actions/checkout@v6
        with:
          lfs: 'false'

      - name: Running build
        run: |
          mpi_opts=''
          if [ ! -z ${{ matrix.mpi }} ]
          then
            mpi_opts="-mpi=${{ matrix.mpi }}"
          fi

          cmd="./build_script.sh -release -arch=${{ matrix.os }}_gf -prec=${{ matrix.precision }} -nt=${{ env.BUILD_NB_THREAD }} -static-link $mpi_opts"
          echo "========================================="
          echo "--  BUILD ${{ matrix.build }} --"
          echo "--  $cmd --"
          echo "========================================="
          source /root/.bashrc
          chmod 755 Compiling_tools/script/*
          chmod 755 ${{ matrix.binary }}/build_script.sh

          mkdir exec
          cd ${{ matrix.binary }}
          eval $cmd
          cd ..

          # Exit with failure if no binaries were generated
          md5sum exec/* || exit 1

      # Upload artifact (since V4 we can't upload artifact using the same name, each one must be unique)
      - name: Upload built artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bins-${{ matrix.os }}-${{ matrix.precision }}-${{ matrix.build }}
          path: exec

      # We upload extlib only once, arbitrary choice
      - name: Upload extlib artifacts
        uses: actions/upload-artifact@v7
        with:
          name: extlib.zip
          path: extlib.zip
        if: ${{ matrix.build == 'starter_linux64_gf' }}

  qa_linux:
    needs: build_linux
    runs-on: ubuntu-latest
    container:
      image: "ghcr.io/opencourant/linux64-bld-qa:ompi4.1.2"
      volumes:
        - /etc/localtime:/etc/localtime:ro

    env:
      hm_reader_extlib: ../../extlib/hm_reader
      hm_reader_cfgfiles: ../../hm_cfg_files
      homeuser: /root
      mpi: ompi
      QA_NB_PROC: 2
      QA_NB_THREAD: 2

    strategy:
      # If one job fails others continue
      fail-fast: false
      matrix:
        os: [linux64]
        # precision: [dp,sp]
        precision: [dp]

    steps:

      # Get git related to the commit
      - name: Checkout git sources
        uses: actions/checkout@v6
        with:
          lfs: 'false'

      - name: Clean local exe dir
        run: |
          rm -rf exec

      # Download artifacts (since V4 we must download all needed artifacts, we could do it using wildcard but it doesn't work ... see https://github.com/actions/download-artifact/issues/337)
      # Using hard name waiting for this issue to be fixed
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: bins-${{ matrix.os }}-${{ matrix.precision }}-starter_linux64_gf
          path: exec
          merge-multiple: true
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: bins-${{ matrix.os }}-${{ matrix.precision }}-engine_linux64_gf_ompi
          path: exec
          merge-multiple: true
      - name: Download extlib artifact
        uses: actions/download-artifact@v8
        with:
          name: extlib.zip

      - name: Unzip extlib
        run: |
          unzip extlib.zip

      - name: Running qa
        run: |
          md5sum exec/* || echo "Nothing in exec/"
          if [ "${{ matrix.precision }}" = "dp" ]
          then
            precision_ext=""
          else
            precision_ext="_${{ matrix.precision }}"
          fi

          chmod 755 exec/*
          cd qa-tests/scripts
          rm -f QA.summary
          chmod 755 or_qa_script or_radioss.pl

          # Allow root to execute mpi command (we are in docker container as root)
          export OMPI_ALLOW_RUN_AS_ROOT=1
          export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1

          source ${{ env.homeuser }}/.bashrc
          export LD_LIBRARY_PATH=${{ env.hm_reader_extlib }}/${{ matrix.os }}:$LD_LIBRARY_PATH

          cmd="./or_qa_script ../../exec/engine_${{ matrix.os }}_gf_${{ env.mpi }}${precision_ext} 1.0 --env:RAD_CFG_PATH=${{ env.hm_reader_cfgfiles }} --system_run --env:OMP_STACKSIZE=400m --exec_script_args='mpiexec -np ${{ env.QA_NB_PROC }}' --env:OMP_NUM_THREADS=${{ env.QA_NB_THREAD }} --output_failures_stdout --xtra_args='--timeoutscript=${{ env.QA_TIMEOUT_PER_TEST_LINUX }}' "
          echo "========================================="
          echo "--  QA ${{ matrix.os }}_${{ matrix.precision }} --"
          echo "--  $cmd --"
          echo "========================================="
          eval $cmd
          res=$?

          # Getting failed test
          nbtestsfailed=$(grep "# Runs Failed\s*:" QA.summary | tail -n 1 | awk -F' ' '{print $5}')
          # Checking if no test has run at all (maybe exec errors)
          nbtestsok=$(grep "# Runs Successful\s*:" QA.summary | tail -n 1 | awk -F' ' '{print $5}')

          if [ $res -gt 0 ] || [ $nbtestsfailed -gt 0 ] || [ $nbtestsok = 0 ]
          then
            echo "All tests are not OK, CI is failed"
            exit 1
          fi

  cleanup_artifacts:
    if: ${{ always() && github.repository_owner == 'OpenCourant' }}
    needs: [qa_linux]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete all artifacts for current run
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              }
            );

            core.info(`Found ${artifacts.length} artifact(s) for run ${context.runId}.`);

            for (const artifact of artifacts) {
              core.info(`Deleting artifact: ${artifact.name} (id=${artifact.id})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }

            core.info('Artifact cleanup completed.');
