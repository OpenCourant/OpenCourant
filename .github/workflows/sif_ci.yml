name: SIF CI

# Dispatchable Apptainer SIF pipeline, used to iterate on the SIF build
# steps without running full deliveries. Builds SIFs from already-published
# container images and uploads them as workflow artifacts (not releases).
# The proven steps run for real inside Delivery stable CI.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Container tag to convert (e.g. latest-20261006)'
        required: true
        default: 'latest-20261006'

jobs:

  build_sif:
    if: ${{ github.repository_owner == 'OpenCourant' }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-latest
            arch_dir: linux64

          - platform: arm64
            runner: ubuntu-24.04-arm
            arch_dir: linuxa64

    env:
      IMAGE: ghcr.io/opencourant/opencourant
      TAG: ${{ github.event.inputs.image_tag }}

    steps:

      - name: Checkout git sources
        uses: actions/checkout@v6
        with:
          lfs: 'false'

      - name: Install Apptainer
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces by default
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get install -y apptainer
          apptainer --version

      - name: Build SIF from the container image
        run: |
          docker pull ${IMAGE}:${TAG}-${{ matrix.platform }}
          apptainer build OpenCourant_${{ matrix.arch_dir }}.sif \
            docker-daemon:${IMAGE}:${TAG}-${{ matrix.platform }}
          ls -lh OpenCourant_${{ matrix.arch_dir }}.sif

      - name: SIF qa
        run: |
          set -e
          cp -a qa-tests/miniqa/ACCELEROMETRES/data /tmp/sifmodel
          cd /tmp/sifmodel
          export OMP_NUM_THREADS=2
          apptainer exec ${GITHUB_WORKSPACE}/OpenCourant_${{ matrix.arch_dir }}.sif \
            starter -i ACCELERO_0000.rad -np 1 > s.out 2>&1 || { cat s.out; exit 1; }
          apptainer exec ${GITHUB_WORKSPACE}/OpenCourant_${{ matrix.arch_dir }}.sif \
            engine -i ACCELERO_0001.rad > e.out 2>&1 || { cat e.out; exit 1; }
          grep "NORMAL TERMINATION" e.out

      - name: Upload SIF artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenCourant_${{ matrix.arch_dir }}.sif
          path: OpenCourant_${{ matrix.arch_dir }}.sif
