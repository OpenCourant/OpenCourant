name: Set up Intel oneAPI on Windows
description: >
  Installs (or restores from cache) the Intel oneAPI components needed to
  build OpenCourant on Windows: ifx + icx from the HPC Kit and MKL from the
  Base Kit. Versions match the toolchain upstream OpenRadioss used
  (compiler 2025.0, MKL 2025.0).

inputs:
  hpckit-url:
    description: Intel oneAPI HPC Kit offline installer URL
    default: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/a37c30c3-a846-4371-a85d-603e9a9eb94c/intel-oneapi-hpc-toolkit-2025.0.1.48_offline.exe
  basekit-url:
    description: Intel oneAPI Base Kit offline installer URL
    default: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/ae29263e-38b9-4d43-86c3-376d6e0668e7/intel-oneapi-base-toolkit-2025.0.1.47_offline.exe
  hpckit-components:
    description: HPC Kit components to install
    default: intel.oneapi.win.ifort-compiler:intel.oneapi.win.cpp-dpcpp-common:intel.oneapi.win.mpi.devel
  basekit-components:
    description: Base Kit components to install
    default: intel.oneapi.win.mkl.devel
  cache-key:
    description: Cache key for the oneAPI installation
    default: oneapi-win-2-compiler2025.0.1-mkl2025.0.1-impi2021.14

runs:
  using: composite
  steps:

    - name: Restore Intel oneAPI cache
      id: oneapi-cache
      uses: actions/cache@v4
      with:
        path: 'C:\Program Files (x86)\Intel\oneAPI'
        key: ${{ inputs.cache-key }}

    - name: Install Intel oneAPI (ifx, icx, MKL)
      if: steps.oneapi-cache.outputs.cache-hit != 'true'
      shell: cmd
      env:
        HPCKIT_URL: ${{ inputs.hpckit-url }}
        BASEKIT_URL: ${{ inputs.basekit-url }}
        HPCKIT_COMPONENTS: ${{ inputs.hpckit-components }}
        BASEKIT_COMPONENTS: ${{ inputs.basekit-components }}
      run: |
        call :install_kit hpckit "%HPCKIT_URL%" "%HPCKIT_COMPONENTS%" || exit /b 1
        call :install_kit basekit "%BASEKIT_URL%" "%BASEKIT_COMPONENTS%" || exit /b 1
        exit /b 0

        REM install_kit <name> <url> <components>
        REM The ~3 GB offline installers occasionally arrive corrupted
        REM (the extraction step detects it), so download+extract retries.
        :install_kit
        setlocal
        set NAME=%~1
        set URL=%~2
        set COMPONENTS=%~3
        set /a ATTEMPT=0
        :retry
        set /a ATTEMPT+=1
        if %ATTEMPT% gtr 3 ( echo %NAME%: giving up after 3 attempts & endlocal & exit /b 1 )
        echo === %NAME%: download attempt %ATTEMPT%
        if exist %TEMP%\%NAME%.exe del %TEMP%\%NAME%.exe
        if exist %NAME%_extracted rd /s/q %NAME%_extracted
        curl.exe -s --output %TEMP%\%NAME%.exe --url "%URL%" --retry 5 --retry-delay 5
        start /b /wait %TEMP%\%NAME%.exe -s -x -f %NAME%_extracted --log %NAME%_extract.log
        if not exist %NAME%_extracted\bootstrapper.exe ( echo %NAME%: extraction failed, retrying & goto retry )
        echo === %NAME%: installing components %COMPONENTS%
        %NAME%_extracted\bootstrapper.exe -s --action install --components=%COMPONENTS% --eula=accept -p=NEED_VS2017_INTEGRATION=0 -p=NEED_VS2019_INTEGRATION=0 -p=NEED_VS2022_INTEGRATION=0 --log-dir=.
        if errorlevel 1 ( echo %NAME%: bootstrapper failed & endlocal & exit /b 1 )
        rd /s/q %NAME%_extracted
        del %TEMP%\%NAME%.exe
        endlocal & exit /b 0
